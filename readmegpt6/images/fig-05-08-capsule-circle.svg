<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="t d">
  <title id="t">胶囊与圆：轴段内部或端帽</title>
  <desc id="d">左：圆心投在轴段内部，法线垂直轴。右：夹到端点后做法线沿连线。</desc>

  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f2937"/></marker>
    <marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d4ed8"/></marker>
    <marker id="ah-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#047857"/></marker>
    <marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2410c"/></marker>
    <style>
      .title { font: 700 16px "Segoe UI","Microsoft YaHei",sans-serif; fill:#111827; }
      .sub { font: 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#4b5563; }
      .lab { font: 700 13px "Segoe UI","Microsoft YaHei",sans-serif; fill:#111827; }
      .small { font: 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#374151; }
      .note { font: 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#1f2937; }
      .ok { font: 700 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#047857; }
      .bad { font: 700 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#b91c1c; }
      .tiny { font: 11px "Segoe UI","Microsoft YaHei",sans-serif; fill:#374151; }
    </style>
  </defs>

  <rect width="880" height="400" fill="#ffffff"/>

  <text x="440" y="28" text-anchor="middle" class="title">图 5-8　胶囊-圆：先找轴段最近点，再当圆圆来算</text>
  <text x="440" y="50" text-anchor="middle" class="sub">三种 Voronoi：内部、起点外、终点外。这里画出内部和终点两种。</text>

  <rect x="16" y="64" width="416" height="320" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="224" y="90" text-anchor="middle" class="lab">情况 1：轴段内部</text>
  <line x1="70" y1="260" x2="350" y2="260" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="70" cy="260" r="28" fill="#bfdbfe" fill-opacity="0.45" stroke="#1d4ed8"/>
  <circle cx="350" cy="260" r="28" fill="#bfdbfe" fill-opacity="0.45" stroke="#1d4ed8"/>
  <circle cx="210" cy="190" r="46" fill="#fed7aa" fill-opacity="0.7" stroke="#c2410c" stroke-width="2"/>
  <circle cx="210" cy="190" r="4" fill="#111827"/>
  <line x1="210" y1="190" x2="210" y2="258" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-n)"/>
  <circle cx="210" cy="232" r="5" fill="#047857"/>
  <text x="224" y="330" text-anchor="middle" class="ok">n=(0,1)，s=−0.05</text>
  <text x="224" y="354" text-anchor="middle" class="small">a=(1.5,0)，p=(1.5,0.275)</text>

  <rect x="448" y="64" width="416" height="320" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="656" y="90" text-anchor="middle" class="lab">情况 2：终点端帽</text>
  <line x1="500" y1="270" x2="700" y2="270" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="500" cy="270" r="24" fill="#bfdbfe" fill-opacity="0.45" stroke="#1d4ed8"/>
  <circle cx="700" cy="270" r="24" fill="#bfdbfe" fill-opacity="0.45" stroke="#1d4ed8"/>
  <circle cx="760" cy="206" r="52" fill="#fed7aa" fill-opacity="0.7" stroke="#c2410c" stroke-width="2"/>
  <line x1="700" y1="270" x2="758" y2="208" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-n)"/>
  <circle cx="724" cy="246" r="5" fill="#047857"/>
  <text x="656" y="330" text-anchor="middle" class="ok">n=(0.6,0.8)，s=−0.05</text>
  <text x="656" y="354" text-anchor="middle" class="small">夹到 (4,0)，不是无限直线</text>

</svg>
