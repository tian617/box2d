<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="t d">
  <title id="t">多边形与圆：边接触或顶点接触</title>
  <desc id="d">左：圆心对着顶边内部。右：圆心对着右上角，法线沿角点连线。</desc>

  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f2937"/></marker>
    <marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d4ed8"/></marker>
    <marker id="ah-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#047857"/></marker>
    <marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2410c"/></marker>
    <style>
      .title { font: 700 16px "Segoe UI","Microsoft YaHei",sans-serif; fill:#111827; }
      .sub { font: 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#4b5563; }
      .lab { font: 700 13px "Segoe UI","Microsoft YaHei",sans-serif; fill:#111827; }
      .small { font: 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#374151; }
      .note { font: 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#1f2937; }
      .ok { font: 700 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#047857; }
      .bad { font: 700 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#b91c1c; }
      .tiny { font: 11px "Segoe UI","Microsoft YaHei",sans-serif; fill:#374151; }
    </style>
  </defs>

  <rect width="880" height="400" fill="#ffffff"/>

  <text x="440" y="28" text-anchor="middle" class="title">图 5-9　多边形-圆：先找最浅分离边，再看圆心落在边还是角</text>
  <text x="440" y="50" text-anchor="middle" class="sub">盒子 (0,0)–(4,2)。左：边接触 s=−0.1。右：刚好贴在角点 (4,2)。</text>

  <rect x="16" y="64" width="416" height="320" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="224" y="90" text-anchor="middle" class="lab">情况 1：边区域</text>
  <rect x="90" y="200" width="220" height="110" fill="#bfdbfe" fill-opacity="0.7" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="200" cy="156" r="44" fill="#fed7aa" fill-opacity="0.75" stroke="#c2410c" stroke-width="2"/>
  <line x1="200" y1="156" x2="200" y2="198" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-n)"/>
  <circle cx="200" cy="189" r="5" fill="#047857"/>
  <text x="224" y="340" text-anchor="middle" class="ok">n=(0,1)，s=−0.1，p=(2,1.95)</text>
  <text x="224" y="364" text-anchor="middle" class="small">顶边分离 0.4 最大，圆心夹在边两端之间</text>

  <rect x="448" y="64" width="416" height="320" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="656" y="90" text-anchor="middle" class="lab">情况 2：顶点区域</text>
  <rect x="500" y="200" width="200" height="110" fill="#bfdbfe" fill-opacity="0.7" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="748" cy="156" r="40" fill="#fed7aa" fill-opacity="0.75" stroke="#c2410c" stroke-width="2"/>
  <line x1="700" y1="200" x2="742" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-n)"/>
  <circle cx="700" cy="200" r="6" fill="#047857"/>
  <text x="656" y="340" text-anchor="middle" class="ok">n=(0.6,0.8)，s=0，p=(4,2)</text>
  <text x="656" y="364" text-anchor="middle" class="small">圆心到角点距离正好等于半径</text>

</svg>
