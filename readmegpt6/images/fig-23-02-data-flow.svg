<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 486" role="img">
  <title>速度积分的数据流</title>
  <desc>输入：状态速度、力、力矩、逆质量、阻尼、重力缩放、重力、h；输出：新速度。</desc>

  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f2937"/></marker><marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d4ed8"/></marker><marker id="ah-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#047857"/></marker><marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2410c"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7c3aed"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b91c1c"/></marker><marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7280"/></marker>
    <style>
      .title { font: 700 16px "Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif; fill:#111827; }
      .sub { font: 12px "Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif; fill:#4b5563; }
      .lab { font: 700 13px "Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif; fill:#111827; }
      .small { font: 12px "Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif; fill:#374151; }
      .note { font: 12px "Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif; fill:#1f2937; }
      .eq { font: 12px "Consolas","Cascadia Mono","Microsoft YaHei",monospace; fill:#1f2937; }
      .eqb { font: 700 13px "Consolas","Cascadia Mono","Microsoft YaHei",monospace; fill:#111827; }
      .ok { font: 700 12px "Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif; fill:#047857; }
      .bad { font: 700 12px "Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif; fill:#b91c1c; }
      .hot { font: 700 12px "Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif; fill:#c2410c; }
    </style>
  </defs>

  <rect width="880" height="486" fill="#ffffff"/>
  <text x="440" y="28" class="title" text-anchor="middle">图 23-2　速度积分读什么、写什么、不碰什么</text>
  <text x="440" y="50" class="sub" text-anchor="middle">输入来自三处，输出只有两个数：新的线速度 v 和角速度 ω。</text>
  <rect x="16" y="70" width="262" height="96" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="28" y="92" class="lab" text-anchor="start">b2BodyState（每个醒着的刚体一份）</text>
  <text x="28" y="118" class="eq" text-anchor="start">linearVelocity</text>
  <text x="176" y="118" class="eqb" text-anchor="start">v</text>
  <text x="214" y="118" class="small" text-anchor="start">m/s</text>
  <text x="28" y="142" class="eq" text-anchor="start">angularVelocity</text>
  <text x="176" y="142" class="eqb" text-anchor="start">ω</text>
  <text x="214" y="142" class="small" text-anchor="start">rad/s</text>
  <rect x="16" y="180" width="262" height="202" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="28" y="202" class="lab" text-anchor="start">b2BodySim（每个醒着的刚体一份）</text>
  <text x="28" y="228" class="eq" text-anchor="start">force</text>
  <text x="160" y="228" class="eqb" text-anchor="start">F</text>
  <text x="196" y="228" class="small" text-anchor="start">N</text>
  <text x="28" y="250" class="eq" text-anchor="start">torque</text>
  <text x="160" y="250" class="eqb" text-anchor="start">τ</text>
  <text x="196" y="250" class="small" text-anchor="start">N·m</text>
  <text x="28" y="272" class="eq" text-anchor="start">invMass</text>
  <text x="160" y="272" class="eqb" text-anchor="start">1/m</text>
  <text x="196" y="272" class="small" text-anchor="start">1/kg</text>
  <text x="28" y="294" class="eq" text-anchor="start">invInertia</text>
  <text x="160" y="294" class="eqb" text-anchor="start">1/I</text>
  <text x="196" y="294" class="small" text-anchor="start">1/(kg·m²)</text>
  <text x="28" y="316" class="eq" text-anchor="start">linearDamping</text>
  <text x="160" y="316" class="eqb" text-anchor="start">c_v</text>
  <text x="196" y="316" class="small" text-anchor="start">1/s</text>
  <text x="28" y="338" class="eq" text-anchor="start">angularDamping</text>
  <text x="160" y="338" class="eqb" text-anchor="start">c_ω</text>
  <text x="196" y="338" class="small" text-anchor="start">1/s</text>
  <text x="28" y="360" class="eq" text-anchor="start">gravityScale</text>
  <text x="160" y="360" class="eqb" text-anchor="start">g_s</text>
  <text x="196" y="360" class="small" text-anchor="start">无量纲</text>
  <rect x="16" y="396" width="262" height="70" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="28" y="418" class="lab" text-anchor="start">世界与步进参数</text>
  <text x="28" y="438" class="eq" text-anchor="start">gravity  g = (0, −10) m/s²（默认）</text>
  <text x="28" y="456" class="eq" text-anchor="start">h = Δt / N（子步时长，秒）</text>
  <rect x="306" y="100" width="306" height="300" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="3"/>
  <text x="459" y="128" class="lab" text-anchor="middle">b2IntegrateVelocitiesTask</text>
  <text x="459" y="148" class="small" text-anchor="middle">每个刚体各算一次，彼此不依赖</text>
  <text x="326" y="190" class="hot" text-anchor="start">线速度</text>
  <text x="326" y="214" class="eqb" text-anchor="start">v ←  v / (1 + h·c_v)</text>
  <text x="352" y="238" class="eqb" text-anchor="start">+ h·(1/m)·F</text>
  <text x="352" y="262" class="eqb" text-anchor="start">+ h·g_s·g</text>
  <text x="326" y="306" class="hot" text-anchor="start">角速度</text>
  <text x="326" y="330" class="eqb" text-anchor="start">ω ←  ω / (1 + h·c_ω)</text>
  <text x="352" y="354" class="eqb" text-anchor="start">+ h·(1/I)·τ</text>
  <text x="459" y="388" class="small" text-anchor="middle">源码：src/solver.c  第 66–112 行</text>
  <line x1="278" y1="118" x2="306" y2="190" stroke="#1f2937" stroke-width="2" marker-end="url(#ah-ink)"/>
  <line x1="278" y1="290" x2="306" y2="290" stroke="#1f2937" stroke-width="2" marker-end="url(#ah-ink)"/>
  <line x1="278" y1="430" x2="306" y2="350" stroke="#1f2937" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="640" y="100" width="224" height="112" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="2.5"/>
  <text x="652" y="124" class="lab" text-anchor="start">写回 b2BodyState</text>
  <text x="652" y="150" class="eq" text-anchor="start">linearVelocity ← 新 v</text>
  <text x="652" y="172" class="eq" text-anchor="start">angularVelocity ← 新 ω</text>
  <text x="652" y="196" class="ok" text-anchor="start">只有这两个字段被改写</text>
  <line x1="612" y1="156" x2="640" y2="156" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-v)"/>
  <rect x="640" y="236" width="224" height="230" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="652" y="260" class="lab" text-anchor="start">这一步不碰</text>
  <text x="652" y="286" class="small" text-anchor="start">位置 deltaPosition</text>
  <text x="652" y="312" class="small" text-anchor="start">朝向 deltaRotation</text>
  <text x="652" y="338" class="small" text-anchor="start">力和力矩的清零（大步末）</text>
  <text x="652" y="364" class="small" text-anchor="start">速度上限钳制（位置积分里）</text>
  <text x="652" y="390" class="small" text-anchor="start">运动锁定（位置积分里）</text>
  <text x="652" y="416" class="small" text-anchor="start">休眠判断（大步末）</text>
</svg>
