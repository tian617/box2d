<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="t d">
  <title id="t">梯形多边形拆成两个三角形再面积加权</title>
  <desc id="d">顶点 (0,0)(6,0)(4,3)(0,3)。两块面积 9 与 6，质心 (38/15, 7/5)，偏向下底。</desc>

  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f2937"/></marker>
    <marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d4ed8"/></marker>
    <marker id="ah-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#047857"/></marker>
    <marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2410c"/></marker>
    <style>
      .title { font: 700 16px "Segoe UI","Microsoft YaHei",sans-serif; fill:#111827; }
      .sub { font: 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#4b5563; }
      .lab { font: 700 13px "Segoe UI","Microsoft YaHei",sans-serif; fill:#111827; }
      .small { font: 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#374151; }
      .note { font: 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#1f2937; }
      .ok { font: 700 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#047857; }
      .bad { font: 700 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#b91c1c; }
    </style>
  </defs>

  <rect width="880" height="430" fill="#ffffff"/>

  <text x="440" y="28" text-anchor="middle" class="title">图 2-9　多边形：从 v0 扇形剖分，按面积把各三角形质心加权</text>
  <text x="440" y="50" text-anchor="middle" class="sub">顶点 (0,0)、(6,0)、(4,3)、(0,3)。下底更长，所以质心低于高度中点，并偏左。</text>
  <rect x="16" y="64" width="848" height="350" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <polygon points="80,340 500,340 360,160 80,160" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="80,340 500,340 360,160" fill="#bfdbfe" fill-opacity="0.85" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="80" y1="340" x2="360" y2="160" stroke="#1d4ed8" stroke-dasharray="5 4"/>
  <text x="70" y="362" class="small">v0</text>
  <text x="500" y="362" class="small">v1 (6,0)</text>
  <text x="368" y="154" class="small">v2 (4,3)</text>
  <text x="50" y="154" class="small">v3 (0,3)</text>
  <circle cx="313" cy="280" r="6" fill="#1d4ed8"/>
  <text x="325" y="276" class="small" fill="#1d4ed8">c1=(10/3,1)  A=9</text>
  <circle cx="173" cy="220" r="6" fill="#c2410c"/>
  <text x="70" y="210" class="small" fill="#c2410c">c2=(4/3,2)  A=6</text>
  <circle cx="257" cy="256" r="8" fill="#047857"/>
  <text x="270" y="248" class="ok">c=(38/15, 7/5)</text>
  <text x="560" y="140" class="note">累计 A·c_rel：</text>
  <text x="560" y="166" class="note">第一块 (30, 9)</text>
  <text x="560" y="192" class="note">第二块 +(8, 12)</text>
  <text x="560" y="218" class="note">合计 (38, 21)，面积 15</text>
  <text x="560" y="250" class="ok">÷15 再加回 v0</text>
  <text x="560" y="282" class="sub">下底更重，cy=1.4 &lt; 1.5</text>
  <text x="560" y="306" class="sub">n 个顶点就循环 n−2 次</text>

</svg>
