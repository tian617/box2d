<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="t d">
  <title id="t">Minkowski 差把两个形状变成原点问题</title>
  <desc id="d">C=A-B。相交当且仅当原点在 C 内。距离等于原点到 C 的距离。</desc>

  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f2937"/></marker>
    <marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d4ed8"/></marker>
    <marker id="ah-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#047857"/></marker>
    <marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2410c"/></marker>
    <marker id="ah-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7c3aed"/></marker>
    <style>
      .title { font: 700 16px "Segoe UI","Microsoft YaHei",sans-serif; fill:#111827; }
      .sub { font: 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#4b5563; }
      .lab { font: 700 13px "Segoe UI","Microsoft YaHei",sans-serif; fill:#111827; }
      .small { font: 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#374151; }
      .note { font: 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#1f2937; }
      .ok { font: 700 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#047857; }
      .bad { font: 700 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#b91c1c; }
    </style>
  </defs>

  <rect width="880" height="420" fill="#ffffff"/>

  <text x="440" y="28" text-anchor="middle" class="title">图 7-1　Minkowski 差：两个形状的距离 = 原点到差集的距离</text>
  <text x="440" y="50" text-anchor="middle" class="sub">C = A − B。若存在 a=b，则差点为 0，所以相交 ⇔ 原点 ∈ C。</text>
  <rect x="16" y="64" width="276" height="340" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="154" y="88" text-anchor="middle" class="lab">形状 A、B</text>
  <polygon points="70,250 150,140 220,250" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="140" y="230" text-anchor="middle" class="lab" fill="#1d4ed8">A</text>
  <rect x="150" y="200" width="90" height="70" fill="#fed7aa" fill-opacity="0.8" stroke="#c2410c" stroke-width="2"/>
  <text x="195" y="242" text-anchor="middle" class="lab" fill="#c2410c">B</text>
  <text x="154" y="340" text-anchor="middle" class="sub">世界里两个凸形</text>

  <rect x="302" y="64" width="276" height="340" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="440" y="88" text-anchor="middle" class="lab">差集 C = A − B</text>
  <polygon points="360,250 430,140 520,180 500,300 340,310" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="430" cy="220" r="5" fill="#b91c1c"/>
  <text x="440" y="214" class="bad">0</text>
  <text x="440" y="340" text-anchor="middle" class="ok">原点在 C 外：两者分离</text>

  <rect x="588" y="64" width="276" height="340" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="726" y="88" text-anchor="middle" class="lab">不必生成全部差点</text>
  <text x="610" y="130" class="note">穷举 ai − bj 再求凸包太贵</text>
  <text x="610" y="160" class="note">GJK 只按需要查询</text>
  <text x="610" y="184" class="ok">某个方向上最远的差点</text>
  <text x="610" y="216" class="note">当前源码：w = wA − wB</text>
  <text x="610" y="240" class="note">输出法线仍从 A 指向 B</text>
  <text x="610" y="272" class="sub">最近差点 p ≈ a* − b*</text>
  <text x="610" y="296" class="sub">A→B 方向是 −p</text>

</svg>
