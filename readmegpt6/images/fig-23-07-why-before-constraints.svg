<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" role="img">
  <title>为什么先积分速度再解约束</title>
  <desc>对比两种顺序对静止在地面上的方块的影响。</desc>

  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f2937"/></marker><marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d4ed8"/></marker><marker id="ah-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#047857"/></marker><marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2410c"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7c3aed"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b91c1c"/></marker><marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7280"/></marker>
    <style>
      .title { font: 700 16px "Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif; fill:#111827; }
      .sub { font: 12px "Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif; fill:#4b5563; }
      .lab { font: 700 13px "Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif; fill:#111827; }
      .small { font: 12px "Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif; fill:#374151; }
      .note { font: 12px "Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif; fill:#1f2937; }
      .eq { font: 12px "Consolas","Cascadia Mono","Microsoft YaHei",monospace; fill:#1f2937; }
      .eqb { font: 700 13px "Consolas","Cascadia Mono","Microsoft YaHei",monospace; fill:#111827; }
      .ok { font: 700 12px "Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif; fill:#047857; }
      .bad { font: 700 12px "Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif; fill:#b91c1c; }
      .hot { font: 700 12px "Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif; fill:#c2410c; }
    </style>
  </defs>

  <rect width="880" height="432" fill="#ffffff"/>
  <text x="440" y="28" class="title" text-anchor="middle">图 23-7　为什么先积分速度，再解约束（教学示意：静止在地面上的方块）</text>
  <text x="440" y="50" class="sub" text-anchor="middle">h = 1/240 s，重力 g = −10 m/s²。每个子步重力把速度改 h·g = −0.0417 m/s。</text>
  <rect x="16" y="64" width="408" height="326" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="220" y="88" class="lab" text-anchor="middle">Box2D 的顺序：先积分速度，再解约束</text>
  <rect x="32" y="104" width="376" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="44" y="126" class="lab" text-anchor="start">子步开始</text>
  <text x="44" y="146" class="small" text-anchor="start">方块静止在地面，v = 0</text>
  <line x1="220" y1="156" x2="220" y2="174" stroke="#1f2937" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="32" y="174" width="376" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="44" y="196" class="lab" text-anchor="start">① 速度积分</text>
  <text x="44" y="216" class="small" text-anchor="start">v = 0 + h·g = −0.0417 m/s</text>
  <line x1="220" y1="226" x2="220" y2="244" stroke="#1f2937" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="32" y="244" width="376" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="44" y="266" class="lab" text-anchor="start">③ 求解</text>
  <text x="44" y="286" class="small" text-anchor="start">接触冲量把 v 推回 ≈ 0</text>
  <line x1="220" y1="296" x2="220" y2="314" stroke="#1f2937" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="32" y="314" width="376" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="44" y="336" class="lab" text-anchor="start">④ 位置积分</text>
  <text x="44" y="356" class="small" text-anchor="start">Δy = h·v ≈ 0，不陷入地面</text>
  <rect x="456" y="64" width="408" height="326" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="660" y="88" class="lab" text-anchor="middle">反例：先解约束，再积分速度</text>
  <rect x="472" y="104" width="376" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="484" y="126" class="lab" text-anchor="start">子步开始</text>
  <text x="484" y="146" class="small" text-anchor="start">方块静止在地面，v = 0</text>
  <line x1="660" y1="156" x2="660" y2="174" stroke="#1f2937" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="472" y="174" width="376" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="484" y="196" class="lab" text-anchor="start">求解</text>
  <text x="484" y="216" class="small" text-anchor="start">此刻 v = 0，没有速度可纠</text>
  <line x1="660" y1="226" x2="660" y2="244" stroke="#1f2937" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="472" y="244" width="376" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="484" y="266" class="lab" text-anchor="start">速度积分</text>
  <text x="484" y="286" class="small" text-anchor="start">v = −0.0417 m/s</text>
  <line x1="660" y1="296" x2="660" y2="314" stroke="#1f2937" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="472" y="314" width="376" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="484" y="336" class="lab" text-anchor="start">位置积分</text>
  <text x="484" y="356" class="small" text-anchor="start">Δy = h·v = −0.000174 m，已陷入</text>
  <text x="440" y="414" class="note" text-anchor="middle">先让所有人按受力“自由走一小步”，再用约束把越界的速度纠回来；位置只用纠正过的速度去推进。</text>
</svg>
