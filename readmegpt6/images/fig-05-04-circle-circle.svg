  <text x="440" y="28" text-anchor="middle" class="title">图 5-4　圆圆接触：沿圆心连线构造完整几何</text>
  <text x="440" y="50" text-anchor="middle" class="sub">a=(1,2)，b=(2.8,4.4)，rA=2，rB=1.2。d=(1.8,2.4)，ℓ=3，n=(0.6,0.8)，s=−0.2 m。</text>
