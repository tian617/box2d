  <text x="86" y="282" class="hot" text-anchor="start">三条线几乎重合</text>
  <rect x="590" y="76" width="274" height="130" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="604" y1="98" x2="644" y2="98" stroke="#c2410c" stroke-width="2.5"/>
  <text x="652" y="102" class="small" text-anchor="start">e^(−z)   精确解（连续物理）</text>
  <line x1="604" y1="128" x2="644" y2="128" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="652" y="132" class="small" text-anchor="start">1/(1+z)  Box2D 实际使用</text>
  <line x1="604" y1="158" x2="644" y2="158" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="652" y="162" class="small" text-anchor="start">1−z      显式欧拉</text>
  <text x="604" y="192" class="bad" text-anchor="start">显式写法 z&gt;1 会翻向，z&gt;2 会发散</text>
