<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="t d">
  <title id="t">点到线段的三块 Voronoi 区域</title>
  <desc id="d">线段 (0,0)-(4,0)。内部投影、夹到起点、夹到终点三种情况。</desc>

  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f2937"/></marker>
    <marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d4ed8"/></marker>
    <marker id="ah-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#047857"/></marker>
    <marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2410c"/></marker>
    <marker id="ah-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7c3aed"/></marker>
    <style>
      .title { font: 700 16px "Segoe UI","Microsoft YaHei",sans-serif; fill:#111827; }
      .sub { font: 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#4b5563; }
      .lab { font: 700 13px "Segoe UI","Microsoft YaHei",sans-serif; fill:#111827; }
      .small { font: 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#374151; }
      .note { font: 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#1f2937; }
      .ok { font: 700 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#047857; }
      .bad { font: 700 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#b91c1c; }
    </style>
  </defs>

  <rect width="880" height="400" fill="#ffffff"/>

  <text x="440" y="28" text-anchor="middle" class="title">图 5-5　点到线段：先投到无限直线，再夹到 [0,1]</text>
  <text x="440" y="50" text-anchor="middle" class="sub">段 p0=(0,0)，p1=(4,0)。内部点投影到段上；段外必须夹到端点，否则等于在检测无限直线。</text>
  <rect x="16" y="64" width="276" height="320" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="154" y="88" text-anchor="middle" class="lab">内部区域</text>
  <line x1="50" y1="240" x2="250" y2="240" stroke="#1d4ed8" stroke-width="4"/>
  <circle cx="50" cy="240" r="4" fill="#1d4ed8"/>
  <circle cx="250" cy="240" r="4" fill="#1d4ed8"/>
  <circle cx="140" cy="140" r="6" fill="#c2410c"/>
  <line x1="140" y1="140" x2="140" y2="236" stroke="#047857" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="140" cy="240" r="5" fill="#047857"/>
  <text x="154" y="290" text-anchor="middle" class="ok">t0=0.375，夹取后仍在内部</text>
  <text x="154" y="314" text-anchor="middle" class="small">q=(1.5, 0.75) → a=(1.5, 0)</text>

  <rect x="302" y="64" width="276" height="320" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="440" y="88" text-anchor="middle" class="lab">起点区域</text>
  <line x1="336" y1="240" x2="536" y2="240" stroke="#1d4ed8" stroke-width="4"/>
  <circle cx="336" cy="240" r="4" fill="#1d4ed8"/>
  <circle cx="300" cy="150" r="6" fill="#c2410c"/>
  <line x1="300" y1="150" x2="336" y2="236" stroke="#047857" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="440" y="290" text-anchor="middle" class="note">t0=−0.25，夹到 0</text>
  <text x="440" y="314" text-anchor="middle" class="small">最近点是 p0，不是直线投影</text>

  <rect x="588" y="64" width="276" height="320" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="726" y="88" text-anchor="middle" class="lab">终点区域</text>
  <line x1="622" y1="240" x2="822" y2="240" stroke="#1d4ed8" stroke-width="4"/>
  <circle cx="822" cy="240" r="4" fill="#1d4ed8"/>
  <circle cx="850" cy="150" r="6" fill="#c2410c"/>
  <line x1="850" y1="150" x2="822" y2="236" stroke="#047857" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="726" y="290" text-anchor="middle" class="note">t0=1.25，夹到 1</text>
  <text x="726" y="314" text-anchor="middle" class="small">最近点是 p1</text>

</svg>
