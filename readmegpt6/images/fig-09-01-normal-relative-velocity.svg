<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="t d">
  <title id="t">法向相对速度：接近为负</title>
  <desc id="d">u=(vB-vA)·n。对撞时 u<0；地面为 A、下落箱子为 B 时 u 为负。</desc>

  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f2937"/></marker>
    <marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d4ed8"/></marker>
    <marker id="ah-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#047857"/></marker>
    <marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2410c"/></marker>
    <marker id="ah-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7c3aed"/></marker>
    <style>
      .title { font: 700 16px "Segoe UI","Microsoft YaHei",sans-serif; fill:#111827; }
      .sub { font: 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#4b5563; }
      .lab { font: 700 13px "Segoe UI","Microsoft YaHei",sans-serif; fill:#111827; }
      .small { font: 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#374151; }
      .note { font: 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#1f2937; }
      .ok { font: 700 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#047857; }
      .bad { font: 700 12px "Segoe UI","Microsoft YaHei",sans-serif; fill:#b91c1c; }
    </style>
  </defs>

  <rect width="880" height="400" fill="#ffffff"/>

  <text x="440" y="28" text-anchor="middle" class="title">图 9-1　法向相对速度：B 相对 A 沿 n 的接近为负</text>
  <text x="440" y="50" text-anchor="middle" class="sub">u = (vB − vA) · n。写求解器前先用这一条检查符号。</text>
  <rect x="16" y="64" width="416" height="320" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="224" y="88" text-anchor="middle" class="lab">两个质点对撞</text>
  <circle cx="130" cy="210" r="38" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="310" cy="210" r="38" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <text x="130" y="216" text-anchor="middle" class="lab">A</text>
  <text x="310" y="216" text-anchor="middle" class="lab">B</text>
  <line x1="176" y1="210" x2="264" y2="210" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#ah-n)"/>
  <text x="220" y="198" text-anchor="middle" class="small" fill="#1d4ed8">n</text>
  <line x1="100" y1="150" x2="168" y2="150" stroke="#047857" stroke-width="2.2" marker-end="url(#ah-v)"/>
  <text x="134" y="140" text-anchor="middle" class="small" fill="#047857">vA</text>
  <line x1="340" y1="150" x2="272" y2="150" stroke="#047857" stroke-width="2.2" marker-end="url(#ah-v)"/>
  <text x="306" y="140" text-anchor="middle" class="small" fill="#047857">vB</text>
  <text x="224" y="280" text-anchor="middle" class="note">u = (vB − vA) · n</text>
  <text x="224" y="304" text-anchor="middle" class="bad">对撞时 u &lt; 0</text>
  <text x="224" y="328" text-anchor="middle" class="ok">分开时 u &gt; 0</text>
  <text x="224" y="360" text-anchor="middle" class="sub">交换 A/B 时，法线也必须一起翻转</text>

  <rect x="448" y="64" width="416" height="320" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="656" y="88" text-anchor="middle" class="lab">地面 A，下落箱子 B</text>
  <line x1="500" y1="300" x2="812" y2="300" stroke="#6b7280" stroke-width="8"/>
  <text x="512" y="328" class="small">A 地面</text>
  <rect x="606" y="168" width="100" height="112" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <circle cx="656" cy="224" r="4" fill="#111827"/>
  <text x="656" y="252" text-anchor="middle" class="lab">B</text>
  <line x1="656" y1="292" x2="656" y2="236" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#ah-n)"/>
  <text x="670" y="260" class="small" fill="#1d4ed8">n = (0, 1)</text>
  <line x1="656" y1="200" x2="656" y2="248" stroke="#047857" stroke-width="2.2" marker-end="url(#ah-v)"/>
  <text x="580" y="230" class="small" fill="#047857">vB 向下</text>
  <text x="656" y="360" text-anchor="middle" class="bad">u = vBy − 0 &lt; 0，正在接近</text>

</svg>
